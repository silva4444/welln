services:
  - type: web
    name: coda-educacional
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CODA_TEACHER_EMAIL
        sync: false
      - key: CODA_TEACHER_PASSWORD
        sync: false
      - key: CODA_TEACHER_CODE
        sync: false
      - key: CODA_ADMIN_EMAIL
        sync: false
      - key: CODA_ADMIN_PASSWORD
        sync: false
      - key: CODA_ADMIN_CODE
        sync: false
